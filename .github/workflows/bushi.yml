name: Update tournament history
on:
  schedule:
    - cron: '43 0,12 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - scripts/update_bushi.py
      - .github/workflows/bushi.yml
permissions:
  contents: write
concurrency:
  group: profile-readme
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Fetch tournament history
        env:
          BUSHI_NAVI_TOKEN: ${{ secrets.BUSHI_NAVI_TOKEN }}
        run: python3 scripts/update_bushi.py
      - name: Commit updated history
        run: |
          if git diff --quiet -- README.md; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update tournament history"
          git push
